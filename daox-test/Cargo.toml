[package]
name = "daox-test"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pour exécuter les requêtes générées par daox
sqlx = { version = "0.8", features = [
    "mysql",
    "postgres",
    "sqlite",
    "runtime-tokio-rustls",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }

# Pour la fonction de lecture sans allocation (Stream)
futures = "0.3"

# Si la BDD contient des dates
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
# daox est utilisé ici pour GÉNÉRER le code pendant le "cargo build"
daox = { path = "../daox" }
tokio = { version = "1", features = ["full"] }
