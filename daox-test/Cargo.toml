[package]
name = "daox-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Integration test suite for the Daox framework."
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["validation"]
validation = ["regex"]

[dependencies]
regex = { version = "1", optional = true }
# Required to execute the generated DAO queries (pure sqlx layer)
sqlx = { version = "0.9", features = [
    "mysql",
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "rust_decimal",
] }
tokio = { version = "1", features = ["full"] }
# Required for zero-allocation reading features (Stream)
futures = "0.3"
# Required if the database contains date/time columns
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.30"
serde_json = "1.0.151"

[build-dependencies]
# daox is used strictly as a build-dependency to GENERATE code during `cargo build`
daox = { path = "../daox", version = "0.2.7" }
tokio = { version = "1", features = ["full"] }
# SQLite is specifically initialized at compile-time directly in build.rs
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-rustls"] }

[dev-dependencies]
regex = "1"
toml = "0.8"
