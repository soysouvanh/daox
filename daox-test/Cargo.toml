[package]
name = "daox-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Integration test suite for the Daox framework."
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["validation"]
validation = ["regex"]

[dependencies]
regex = { version = ">=1.10, <2", optional = true }
# Required to execute the generated DAO queries (pure sqlx layer)
sqlx = { version = ">=0.9, <0.10", features = [
    "mysql",
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "rust_decimal",
] }
tokio = { version = ">=1.38, <2", features = ["full"] }
# Required for zero-allocation reading features (Stream)
futures = ">=0.3, <0.4"
# Required if the database contains date/time columns
chrono = { version = ">=0.4, <0.5", features = ["serde"] }
rust_decimal = ">=1.30, <2"
serde_json = ">=1.0.100, <2"

[build-dependencies]
# daox is used strictly as a build-dependency to GENERATE code during `cargo build`
daox = { path = "../daox", version = "0.2.8" }
tokio = { version = ">=1.38, <2", features = ["full"] }
# SQLite is specifically initialized at compile-time directly in build.rs
sqlx = { version = ">=0.9, <0.10", features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
] }
