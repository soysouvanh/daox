
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: daox_test
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql

  pg:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: daox_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./init_pg.sql:/docker-entrypoint-initdb.d/init_pg.sql