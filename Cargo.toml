[workspace]
members = ["daox", "daox-test"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vincent SOYSOUVANH <vincent.soysouvanh@gmail.com>"]
description = "Daox is a high-performance, Database-First DAO generator for Rust. It introspects MySQL, PostgreSQL, and SQLite schemas at compile time to produce strongly-typed API layers."
readme = "README.md"
repository = "https://github.com/soysouvanh/daox"
license = "MIT"
keywords = ["dao", "sqlx", "codegen", "database", "orm"]
categories = ["database", "development-tools"]
