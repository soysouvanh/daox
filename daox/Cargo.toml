[package]
name = "daox"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["mysql", "postgres", "sqlite"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
# Database introspection (MySQL/MariaDB, PostgreSQL, SQLite)
sqlx = { version = ">=0.9, <0.10", features = [
    "runtime-tokio",
    "tls-rustls",
    "any",
] }
tokio = { version = ">=1.38, <2", features = [
    "rt-multi-thread",
    "time",
    "fs",
    "net",
    "macros",
] }

# Minimal dependencies (SOTA)
toml = ">=0.8.23, <0.9"
serde = { version = ">=1.0.200, <2", features = ["derive"] }
regex = ">=1.10, <2"
rayon = ">=1.10, <2"
